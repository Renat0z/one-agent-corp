```yaml
version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pingboard-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/data
    depends_on:
      evolution:
        condition: service_healthy
    networks:
      - pingboard
    # Not exposed directly — nginx is the only public entry point
    expose:
      - "3000"

  evolution:
    image: atendai/evolution-api:latest
    container_name: pingboard-evolution
    restart: unless-stopped
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    environment:
      SERVER_URL:               http://evolution:8080
      AUTHENTICATION_TYPE:      apikey
      AUTHENTICATION_API_KEY:   ${EVOLUTION_API_KEY}
      LOG_LEVEL:                ERROR
      DEL_INSTANCE:             "false"
      CLEAN_STORE_CLEANING_INTERVAL: "7200"
    healthcheck:
      test:         ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null 2>&1 || exit 1"]
      interval:     30s
      timeout:      10s
      retries:      5
      start_period: 30s
    networks:
      - pingboard

  nginx:
    image: nginx:1.25-alpine
    container_name: pingboard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - pingboard

volumes:
  db_data:
  evolution_instances:
  evolution_store:

networks:
  pingboard:
    driver: bridge
```