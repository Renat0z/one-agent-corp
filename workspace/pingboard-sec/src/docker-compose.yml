version: '3.8'
services:
  app:
    build: .
    environment:
      - PORT=3000
      - DB_PATH=/data/pingboard.db
      - MASTER_API_KEY=${MASTER_API_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_ID=${EVOLUTION_INSTANCE_ID}
    volumes:
      - pingboard_data:/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  pingboard_data: