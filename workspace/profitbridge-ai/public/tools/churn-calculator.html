
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Impacto de Churn | ChurnShield</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-6">
    <div class="max-w-md mx-auto bg-slate-800 rounded-xl shadow-2xl overflow-hidden p-8 border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-blue-400">ChurnShield Calc</h2>
        <p class="text-slate-400 mb-6 text-sm">Descubra quanto seu churn está custando ao seu MRR anualmente.</p>
        
        <div id="calculator-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Seu E-mail Profissional</label>
                <input type="email" id="email" placeholder="voce@empresa.com" class="w-full bg-slate-700 border border-slate-600 rounded p-2 focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">MRR Atual ($)</label>
                <input type="number" id="mrr" value="50000" class="w-full bg-slate-700 border border-slate-600 rounded p-2 focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Taxa de Churn Mensal (%)</label>
                <input type="number" id="churn" value="5" class="w-full bg-slate-700 border border-slate-600 rounded p-2 focus:border-blue-500 outline-none">
            </div>
            
            <button onclick="calculate()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded transition-all shadow-lg">Calcular e Receber Diagnóstico</button>
        </div>

        <div id="result" class="mt-8 p-4 bg-slate-900 rounded hidden border-l-4 border-red-500">
            <p class="text-slate-400 text-xs uppercase font-bold">Perda de MRR em 12 meses:</p>
            <h3 id="loss" class="text-3xl font-black text-red-500">$ 0</h3>
            <p class="text-slate-400 text-[10px] mt-2 italic">*Um relatório detalhado foi preparado para seu e-mail.</p>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-700 text-center">
            <p class="text-xs text-slate-500 mb-4">Pare de perder dinheiro hoje.</p>
            <a href="#" class="inline-block bg-white text-slate-900 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider hover:bg-blue-400 transition-colors">Conhecer ChurnShield</a>
        </div>
    </div>

    <script>
        function calculate() {
            const mrr = parseFloat(document.getElementById('mrr').value);
            const churn = parseFloat(document.getElementById('churn').value) / 100;
            
            // Cálculo simples de perda composta em 12 meses
            let currentMrr = mrr;
            let totalLoss = 0;
            for(let i=0; i<12; i++) {
                let monthlyLoss = currentMrr * churn;
                totalLoss += monthlyLoss;
                currentMrr -= monthlyLoss;
            }

            document.getElementById('loss').innerText = '$ ' + totalLoss.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0});
            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
