version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - data:/app/db
    env_file: .env
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  data: