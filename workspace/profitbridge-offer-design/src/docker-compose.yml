version: '3.8'
services:
  app:
    build: .
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/bridge.db
    volumes:
      - bridge-data:/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  bridge-data: