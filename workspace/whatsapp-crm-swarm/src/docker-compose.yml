version: '3.8'
services:
  app:
    build: .
    container_name: whatsapp-crm-swarm_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/crm.db
      - NODE_ENV=${NODE_ENV:-production}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm-network

  nginx:
    image: nginx:alpine
    container_name: whatsapp-crm-swarm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  data:
  logs: