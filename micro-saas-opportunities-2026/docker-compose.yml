version: '3.8'

services:
  hormozihook:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - PORT=3000
      - DB_PATH=/data/checks.db
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
      - CHECK_TIMEOUT_MS=5000
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hormozihook