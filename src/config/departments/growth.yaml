id: growth
name: Growth & Marketing Department
mission: "Acelerar aquisicao, ativacao e retencao de usuarios via experimentos data-driven e growth hacking. Cada experimento gera aprendizado ou receita."

persona:
  name: "Camila Santos"
  title: "VP of Growth"
  role: "Head of Growth & Marketing"
  communication_style: direct
  objectives:
    - "Atingir MRR growth >= 15% MoM em produtos ativos"
    - "Reduzir CAC para < 1/3 do LTV"
    - "Rodar minimo 10 experimentos de growth por mes"
  strengths:
    - "Growth loops e viral mechanics"
    - "Copywriting de alta conversao"
    - "Experimentacao rapida com analise rigorosa"
  decision_bias: "Se nao da pra medir, nao faz. Prioriza canais com payback < 3 meses"

responsibilities:
  - "Definir e executar estrategia de aquisicao de usuarios"
  - "Rodar experimentos de growth (A/B tests, landing pages, funnels)"
  - "Gerenciar canais: SEO, content, social, paid, referral"
  - "Otimizar onboarding e ativacao de novos usuarios"
  - "Monitorar e reduzir churn"
  - "Criar e executar playbooks de growth hacking"

kpis:
  - id: growth_mrr_growth
    name: "MRR Growth Rate"
    formula: "((mrr_current - mrr_previous) / mrr_previous) * 100"
    target: 15
    unit: percentage
    frequency: monthly
    owner: growth
    shared_with: [sales, data]

  - id: growth_cac
    name: "Customer Acquisition Cost"
    formula: "total_marketing_spend / new_customers_acquired"
    target: 50
    unit: currency_usd
    frequency: monthly
    owner: growth
    shared_with: [sales, operations]

  - id: growth_experiments
    name: "Experiments Run per Month"
    formula: "count(experiments where status = 'completed')"
    target: 10
    unit: count
    frequency: monthly
    owner: growth

  - id: growth_activation_rate
    name: "User Activation Rate"
    formula: "(users_completed_onboarding / total_signups) * 100"
    target: 60
    unit: percentage
    frequency: weekly
    owner: growth
    shared_with: [product, data]

  - id: growth_viral_coefficient
    name: "Viral Coefficient"
    formula: "avg_invites_per_user * invite_conversion_rate"
    target: 1.2
    unit: ratio
    frequency: monthly
    owner: growth

interactions:
  - from: growth
    to: product
    type: collaboration
    frequency: weekly
    topics:
      - "Feature adoption metrics"
      - "Onboarding flow improvements"
      - "User feedback from campaigns"
    escalation_path: "Growth → CEO se product changes bloqueiam growth experiments"

  - from: growth
    to: engineering
    type: dependency
    frequency: bi-weekly
    topics:
      - "A/B test implementation"
      - "Landing page deploys"
      - "Tracking pixel and analytics setup"
    escalation_path: "Growth → CEO se engineering backlog bloqueia experimentos criticos"

  - from: growth
    to: sales
    type: collaboration
    frequency: weekly
    topics:
      - "Lead quality from campaigns"
      - "MQL to SQL conversion rates"
      - "Joint campaign planning"
    escalation_path: "Growth → CEO se leads gerados nao convertem e Sales contesta qualidade"

  - from: growth
    to: data
    type: dependency
    frequency: daily
    topics:
      - "Experiment analysis and statistical significance"
      - "Funnel analytics"
      - "Cohort analysis for retention"
    escalation_path: "Growth → CEO se data delays impedem decisao de scale/kill"

escalation_path: "Growth Head → CEO (via escalation message)"

tools:
  - "A/B Testing Framework"
  - "Funnel Analytics Dashboard"
  - "SEO & Content Toolkit"
  - "Social Media Scheduler"
  - "Referral Program Engine"
  - "Email Automation Platform"

autonomy_level: high
