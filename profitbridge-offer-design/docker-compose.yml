version: '3.8'

services:
  profitbridge:
    build: .
    container_name: profitbridge-api
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    restart: always
    environment:
      - PORT=3000
      - DB_PATH=/data/checks.db
      - CHECK_TIMEOUT_MS=5000

  nginx:
    image: nginx:alpine
    container_name: profitbridge-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - profitbridge
    restart: always
